name: Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: Hachu04/code-reviewer@v1
        with:
          api_key: ${{ secrets.LLM_API_KEY }}